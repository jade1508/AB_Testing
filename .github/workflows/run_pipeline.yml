name: Automated A/B Testing Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  repository_dispatch:
    types: [trigger_ab_pipeline]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas scipy statsmodels requests; fi

      - name: Execute Pipeline Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          REGISTRY_PATH: 'registry.csv'
        run: |
          python pipeline_expansion.py
