name: Automated A/B Testing Pipeline

on:
  # 1. Chạy tự động theo lịch (Cron Job) lúc 08:00 AM UTC hàng ngày
  schedule:
    - cron: '0 8 * * *'

  # 2. Cho phép trigger qua API / Webhook (repository_dispatch)
  repository_dispatch:
    types: [trigger_ab_pipeline]

  # 3. Cho phép kích hoạt thủ công từ giao diện GitHub Actions (UI)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout nguồn mã từ Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Bước 2: Dựng môi trường Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Tối ưu thời gian build bằng cách cache dependencies

      # Bước 3: Cài đặt các thư viện cần thiết
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas scipy statsmodels requests; fi

      # Bước 4: Chạy script tính toán A/B test & bắn Webhook sang Make.com
      - name: Execute Pipeline Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }} # Khai báo URL Webhook an toàn từ GitHub Secrets
        run: |
          python pipeline.py