name: Automated A/B Testing Pipeline

on:
  # 1. Scheduled trigger (Cron Job) running daily at 08:00 AM UTC
  schedule:
    - cron: '0 8 * * *'

  # 2. External trigger via API / Webhook (repository_dispatch)
  repository_dispatch:
    types: [trigger_ab_pipeline]

  # 3. Manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10 environment with pip caching
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Install required dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas scipy statsmodels requests; fi

      # Step 4: Execute statistical analysis script & send Webhook payload to Make.com
      - name: Execute Pipeline Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python pipeline.py
